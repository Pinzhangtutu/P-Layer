<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6fb"/><stop offset="1" stop-color="#f9fbfd"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ec"/><stop offset="1" stop-color="#effaf6"/></linearGradient></defs>
<rect width="1600" height="900" fill="#e9eef3"/><rect x="35" y="35" width="745" height="830" rx="34" fill="url(#a)"/><rect x="820" y="35" width="745" height="830" rx="34" fill="url(#b)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#172235">
<text x="80" y="95" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="3">A · 安静学术工作台</text><text x="80" y="145" font-size="29" font-weight="700">从好奇开始，走一圈科学环</text><text x="80" y="181" font-size="15" fill="#6f7c8f">清晰、克制、适合长期研究记录</text>
<rect x="80" y="225" width="260" height="530" rx="24" fill="#ffffffcc" stroke="#dce6ee"/><text x="108" y="270" font-size="19" font-weight="700">从哪里进入？</text><line x1="108" y1="295" x2="310" y2="295" stroke="#dce5ee"/><circle cx="126" cy="342" r="18" fill="#e8f2ff"/><text x="116" y="349" font-size="18">💡</text><text x="158" y="340" font-size="15" font-weight="700">头脑风暴</text><text x="158" y="363" font-size="12" fill="#718096">从模糊 Idea 到 RQ</text><line x1="108" y1="395" x2="310" y2="395" stroke="#dce5ee"/><circle cx="126" cy="442" r="18" fill="#e6f8f2"/><text x="116" y="449" font-size="18">📚</text><text x="158" y="440" font-size="15" font-weight="700">文献网络</text><text x="158" y="463" font-size="12" fill="#718096">从阅读进入科学环</text><line x1="108" y1="495" x2="310" y2="495" stroke="#dce5ee"/><circle cx="126" cy="542" r="18" fill="#f0ebff"/><text x="116" y="549" font-size="18">↩</text><text x="158" y="540" font-size="15" font-weight="700">继续探索</text><text x="158" y="563" font-size="12" fill="#718096">回到已有的 Idea</text>
<g transform="translate(570 495)"><circle r="150" fill="none" stroke="#cadbe9"/><circle r="105" fill="none" stroke="#cadbe9" stroke-dasharray="5 7"/><circle r="66" fill="#2563eb" stroke="#edf6fb" stroke-width="9"/><text y="5" text-anchor="middle" fill="white" font-size="17" font-weight="700">我的 Idea</text><g font-size="13" font-weight="700" text-anchor="middle"><text y="-170">理论与概念</text><text x="-180" y="8">经验观察</text><text x="180" y="8">假设预测</text><text y="184">证据与修正</text></g><g fill="#fff" stroke="#d6e5f1" stroke-width="7"><circle cy="-150" r="25"/><circle cx="-150" r="0" r="25"/><circle cx="150" r="0" r="25"/><circle cy="150" r="25"/></g></g>
<text x="80" y="805" font-size="13" fill="#6f7c8f">关键词：可信 · 安静 · 结构 · 长期积累</text>
<text x="865" y="95" font-size="15" font-weight="700" fill="#d97706" letter-spacing="3">B · 温暖科学旅程</text><text x="865" y="145" font-size="29" font-weight="700">每个好奇，都值得走一圈</text><text x="865" y="181" font-size="15" fill="#718096">亲近、有生命力、降低第一次研究的压力</text>
<rect x="865" y="225" width="260" height="530" rx="24" fill="#fffdf8dd" stroke="#eadfce"/><text x="893" y="270" font-size="19" font-weight="700">选择你的起点</text><line x1="893" y1="295" x2="1095" y2="295" stroke="#eadfce"/><rect x="893" y="320" width="202" height="78" rx="18" fill="#fff0cf"/><text x="915" y="350" font-size="15" font-weight="700">💡  我有一个想法</text><text x="915" y="374" font-size="12" fill="#8a7355">让 Pia! 陪我把它说清楚</text><rect x="893" y="420" width="202" height="78" rx="18" fill="#dff5eb"/><text x="915" y="450" font-size="15" font-weight="700">📚  我读过一篇文献</text><text x="915" y="474" font-size="12" fill="#668174">看看它改变了什么</text><rect x="893" y="520" width="202" height="78" rx="18" fill="#eae4ff"/><text x="915" y="550" font-size="15" font-weight="700">↩  我想继续探索</text><text x="915" y="574" font-size="12" fill="#756c93">回到我的研究旅程</text>
<g transform="translate(1350 500)"><circle r="150" fill="none" stroke="#dfcda9" stroke-width="2"/><circle r="104" fill="none" stroke="#b8dacc" stroke-width="2" stroke-dasharray="6 8"/><circle r="64" fill="#263b4b" stroke="#fff8ec" stroke-width="9"/><text y="0" text-anchor="middle" fill="#fff8ec" font-size="16" font-weight="700">我的探索</text><g font-size="13" font-weight="700" text-anchor="middle"><text y="-170">理论与概念</text><text x="-180" y="8">我看见了什么</text><text x="180" y="8">如果它成立呢</text><text y="184">我如何知道</text></g><g fill="#fffdf8" stroke="#dfcda9" stroke-width="7"><circle cy="-150" r="25"/><circle cx="-150" cy="0" r="25"/><circle cx="150" cy="0" r="25"/><circle cy="150" r="25"/></g></g>
<text x="865" y="805" font-size="13" fill="#8a7355">关键词：好奇 · 温度 · 邀请 · Pia! 品牌感</text>
</g></svg>
