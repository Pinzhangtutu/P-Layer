<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#e9eef3"/>
<rect x="35" y="35" width="745" height="830" rx="34" fill="#f2f8fc" stroke="#dce7ef"/>
<rect x="820" y="35" width="745" height="830" rx="34" fill="#fff8ec" stroke="#eadfce"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="80" y="100" font-size="15" font-weight="700" letter-spacing="3" fill="#2563eb">A · 安静学术工作台</text><text x="80" y="150" font-size="30" font-weight="700" fill="#172235">从好奇开始，走一圈科学环</text><text x="80" y="185" font-size="15" fill="#6f7c8f">清晰、克制、适合长期研究记录</text>
<rect x="80" y="235" width="280" height="490" rx="24" fill="#fff" stroke="#dce7ef"/><text x="112" y="280" font-size="19" font-weight="700" fill="#172235">从哪里进入？</text><line x1="112" y1="305" x2="328" y2="305" stroke="#dce5ee"/><text x="112" y="365" font-size="16" font-weight="700" fill="#172235">💡 头脑风暴</text><text x="112" y="392" font-size="13" fill="#6f7c8f">从模糊 Idea 到 RQ</text><line x1="112" y1="425" x2="328" y2="425" stroke="#dce5ee"/><text x="112" y="485" font-size="16" font-weight="700" fill="#172235">📚 文献网络</text><text x="112" y="512" font-size="13" fill="#6f7c8f">从阅读进入科学环</text><line x1="112" y1="545" x2="328" y2="545" stroke="#dce5ee"/><text x="112" y="605" font-size="16" font-weight="700" fill="#172235">↩ 继续探索</text><text x="112" y="632" font-size="13" fill="#6f7c8f">回到已有的 Idea</text>
<g transform="translate(570 485)" text-anchor="middle"><circle r="155" fill="none" stroke="#c5d8e7"/><circle r="105" fill="none" stroke="#c5d8e7" stroke-dasharray="5 7"/><circle r="67" fill="#2563eb" stroke="#eaf3fa" stroke-width="10"/><text y="6" font-size="17" font-weight="700" fill="#fff">我的 Idea</text><text y="-174" font-size="13" font-weight="700" fill="#172235">理论与概念</text><text x="-190" y="6" font-size="13" font-weight="700" fill="#172235">经验观察</text><text x="190" y="6" font-size="13" font-weight="700" fill="#172235">假设预测</text><text y="188" font-size="13" font-weight="700" fill="#172235">证据与修正</text></g>
<text x="80" y="805" font-size="13" fill="#6f7c8f">可信 · 安静 · 结构 · 长期积累</text>
<text x="865" y="100" font-size="15" font-weight="700" letter-spacing="3" fill="#c87516">B · 温暖科学旅程</text><text x="865" y="150" font-size="30" font-weight="700" fill="#263b4b">每个好奇，都值得走一圈</text><text x="865" y="185" font-size="15" fill="#8a7355">亲近、有生命力、降低第一次研究的压力</text>
<rect x="865" y="235" width="280" height="490" rx="24" fill="#fffdf8" stroke="#eadfce"/><text x="897" y="280" font-size="19" font-weight="700" fill="#263b4b">选择你的起点</text><rect x="897" y="325" width="216" height="82" rx="18" fill="#fff0cf"/><text x="920" y="360" font-size="16" font-weight="700" fill="#263b4b">💡 我有一个想法</text><text x="920" y="386" font-size="13" fill="#8a7355">让 Pia! 陪我把它说清楚</text><rect x="897" y="430" width="216" height="82" rx="18" fill="#dff5eb"/><text x="920" y="465" font-size="16" font-weight="700" fill="#263b4b">📚 我读过一篇文献</text><text x="920" y="491" font-size="13" fill="#668174">看看它改变了什么</text><rect x="897" y="535" width="216" height="82" rx="18" fill="#eae4ff"/><text x="920" y="570" font-size="16" font-weight="700" fill="#263b4b">↩ 我想继续探索</text><text x="920" y="596" font-size="13" fill="#756c93">回到我的研究旅程</text>
<g transform="translate(1350 485)" text-anchor="middle"><circle r="155" fill="none" stroke="#dfcda9"/><circle r="105" fill="none" stroke="#b8dacc" stroke-dasharray="6 8"/><circle r="67" fill="#263b4b" stroke="#fff8ec" stroke-width="10"/><text y="6" font-size="17" font-weight="700" fill="#fff8ec">我的探索</text><text y="-174" font-size="13" font-weight="700" fill="#263b4b">理论与概念</text><text x="-190" y="6" font-size="13" font-weight="700" fill="#263b4b">我看见了什么</text><text x="190" y="6" font-size="13" font-weight="700" fill="#263b4b">如果它成立呢</text><text y="188" font-size="13" font-weight="700" fill="#263b4b">我如何知道</text></g>
<text x="865" y="805" font-size="13" fill="#8a7355">好奇 · 温度 · 邀请 · Pia! 品牌感</text>
</g></svg>
