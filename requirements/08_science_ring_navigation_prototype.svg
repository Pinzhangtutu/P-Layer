<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7fb"/><stop offset=".62" stop-color="#fbfcfd"/><stop offset="1" stop-color="#edf4ff"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2767df"/><stop offset="1" stop-color="#3a8bcf"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6083a1" flood-opacity=".14"/></filter></defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#172235">
<text x="58" y="70" font-size="28" font-weight="700">P<tspan fill="#2563eb">-</tspan>Layer</text><text x="220" y="69" font-size="13" fill="#8290a1">/ research begins with curiosity</text><rect x="1227" y="42" width="155" height="42" rx="21" fill="#ffffffaa" stroke="#dce5ee"/><text x="1252" y="68" font-size="14" fill="#6f7c8f">我的空间　⌄</text>
<text x="58" y="150" font-size="14" font-weight="700" letter-spacing="4" fill="#2563eb">THE SCIENCE CYCLE</text><text x="58" y="208" font-size="48" font-weight="700">从好奇开始，走一圈自己的科学环。</text><text x="58" y="250" font-size="19" fill="#6f7c8f">你可以从一个生活观察开始，也可以从一篇文献开始。P-Layer 不替你得出结论，</text><text x="58" y="282" font-size="19" fill="#6f7c8f">而是陪你把想法变得清楚、可检验、值得继续。</text>
<rect x="58" y="330" width="360" height="480" rx="28" fill="#ffffffdd" stroke="#e0e9f0" filter="url(#shadow)"/><text x="86" y="374" font-size="20" font-weight="700">从哪里进入？</text><text x="86" y="402" font-size="14" fill="#6f7c8f">科学研究不是一条直线。选择此刻最接近你的入口。</text>
<line x1="86" y1="438" x2="390" y2="438" stroke="#dce5ee"/><circle cx="110" cy="474" r="20" fill="#e8f2ff"/><text x="100" y="482" font-size="20">💡</text><text x="146" y="470" font-size="16" font-weight="700">我的头脑风暴</text><text x="146" y="494" font-size="13" fill="#6f7c8f">从模糊想法、观察或困惑开始</text><text x="146" y="515" font-size="13" fill="#6f7c8f">逐步形成命题与研究问题。</text>
<line x1="86" y1="544" x2="390" y2="544" stroke="#dce5ee"/><circle cx="110" cy="580" r="20" fill="#e6f8f2"/><text x="100" y="588" font-size="20">📚</text><text x="146" y="576" font-size="16" font-weight="700">我的文献网络</text><text x="146" y="600" font-size="13" fill="#6f7c8f">从读过的文献、怀疑或共鸣开始，</text><text x="146" y="621" font-size="13" fill="#6f7c8f">看见它们如何改变你的想法。</text>
<line x1="86" y1="650" x2="390" y2="650" stroke="#dce5ee"/><circle cx="110" cy="686" r="20" fill="#f2edff"/><text x="100" y="694" font-size="20">↩</text><text x="146" y="682" font-size="16" font-weight="700">继续上一次探索</text><text x="146" y="706" font-size="13" fill="#6f7c8f">回到一个正在成长的 Idea，继续检查</text><text x="146" y="727" font-size="13" fill="#6f7c8f">假设或连接新的证据。</text>
<rect x="448" y="330" width="934" height="480" rx="28" fill="#ffffffdd" stroke="#e0e9f0" filter="url(#shadow)"/><text x="480" y="374" font-size="20" font-weight="700">科学环</text><text x="480" y="402" font-size="14" fill="#6f7c8f">你可以从任意位置进入，也可以随时回到前面重新思考。</text><circle cx="1255" cy="369" r="5" fill="#2563eb"/><text x="1267" y="374" font-size="12" fill="#6f7c8f">我的思考</text><circle cx="1255" cy="394" r="5" fill="#2aa8b8"/><text x="1267" y="399" font-size="12" fill="#6f7c8f">我的证据</text>
<g transform="translate(915 575)"><circle r="203" fill="none" stroke="#cbdbe8"/><circle r="146" fill="none" stroke="#c8dce9" stroke-dasharray="5 6"/><g stroke="#c9d9e6" stroke-width="2"><line x1="0" y1="0" x2="-154" y2="-126"/><line x1="0" y1="0" x2="154" y2="-126"/><line x1="0" y1="0" x2="154" y2="126"/><line x1="0" y1="0" x2="-154" y2="126"/></g><circle r="82" fill="url(#core)" stroke="#edf5fb" stroke-width="10" filter="url(#shadow)"/><text x="0" y="-3" text-anchor="middle" fill="white" font-size="20" font-weight="700">我的研究想法</text><text x="0" y="20" text-anchor="middle" fill="#dcecff" font-size="12">Idea · RQ · Project</text>
<g transform="translate(0 -203)"><circle r="34" fill="white" stroke="#dce9ff" stroke-width="8"/><text y="9" text-anchor="middle" font-size="27">◇</text><text y="63" text-anchor="middle" font-size="14" font-weight="700">理论与概念</text><text y="81" text-anchor="middle" font-size="11" fill="#6f7c8f">我如何理解它</text></g>
<g transform="translate(-203 0)"><circle r="34" fill="white" stroke="#dcf6ee" stroke-width="8"/><text y="9" text-anchor="middle" font-size="27">✦</text><text y="63" text-anchor="middle" font-size="14" font-weight="700">经验概括</text><text y="81" text-anchor="middle" font-size="11" fill="#6f7c8f">我看见了什么</text></g>
<g transform="translate(203 0)"><circle r="34" fill="white" stroke="#fff0cf" stroke-width="8"/><text y="9" text-anchor="middle" font-size="27">⌁</text><text y="63" text-anchor="middle" font-size="14" font-weight="700">假设与预测</text><text y="81" text-anchor="middle" font-size="11" fill="#6f7c8f">如果它成立呢</text></g>
<g transform="translate(0 203)"><circle r="34" fill="white" stroke="#e8e1ff" stroke-width="8"/><text y="9" text-anchor="middle" font-size="27">◎</text><text y="63" text-anchor="middle" font-size="14" font-weight="700">观察与证据</text><text y="81" text-anchor="middle" font-size="11" fill="#6f7c8f">我如何知道</text></g></g>
<line x1="480" y1="760" x2="1350" y2="760" stroke="#dce5ee"/><text x="480" y="790" font-size="13" fill="#6f7c8f">任何一个想法，都可以从这里开始。</text><rect x="1192" y="775" width="158" height="40" rx="13" fill="#2563eb"/><text x="1215" y="800" font-size="14" font-weight="700" fill="white">进入头脑风暴　→</text>
</g></svg>
